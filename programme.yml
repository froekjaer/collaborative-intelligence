schema_version: 1

programme:
  id: collaborative-intelligence
  name: Collaborative Intelligence

repository:
  full_name: froekjaer/collaborative-intelligence
  role: programme-governance
  lifecycle: foundation
  status: active
  version: "1.0"
  default_branch: main

purpose:
  summary: >-
    Programme-level entry point owning the research vision, programme architecture,
    shared research posture and cross-repository coherence.

ownership:
  owns:
    - programme-vision
    - programme-architecture
    - research-method
    - cross-repository-roadmap
    - programme-level-findings
  does_not_own:
    - canonical-mission-semantics
    - platform-runtime-contracts
    - mission-specific-evidence
    - publication-rendering

dependencies:
  provides_to:
    - repository: froekjaer/mission-framework
      capability: programme-context
    - repository: froekjaer/Mission-Platform
      capability: programme-context
    - repository: froekjaer/mission-solar-eclipse
      capability: programme-context
    - repository: froekjaer/-Publication-Pipeline
      capability: programme-catalogue
  consumes_from:
    - repository: froekjaer/mission-framework
      capability: canonical-semantics
    - repository: froekjaer/mission-solar-eclipse
      capability: greenfield-evidence
    - repository: froekjaer/timelapse-pro
      capability: brownfield-evidence

current:
  baseline: Foundation Release v1.0
  initiative: Programme 360 and dynamic current-state generation
  roadmap: README.md
  status_document: PROGRAMME-360-REVIEW.md
  architecture_document: PROGRAMME-ARCHITECTURE.md

publication:
  include:
    - README.md
    - PROGRAMME-ARCHITECTURE.md
    - PROGRAMME-360-REVIEW.md
  authority: programme
